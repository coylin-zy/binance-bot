services:
  web-ui:
    build: .
    restart: unless-stopped
    container_name: ft-dashboard
    init: true
    environment:
      FREQTRADE_URL: http://freqtrade:8080
      FREQTRADE_WS_TOKEN: ${FREQTRADE_WS_TOKEN:?FREQTRADE_WS_TOKEN is required}
      FREQTRADE_TIMEOUT_MS: "10000"
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://api.binance.com}
      BINANCE_TIMEOUT_MS: ${BINANCE_TIMEOUT_MS:-8000}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-10000}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-0}
      LLM_COST_PER_1K_TOKENS_USD: ${LLM_COST_PER_1K_TOKENS_USD:-0.002}
      LLM_RETRY_BASE_MS: ${LLM_RETRY_BASE_MS:-150}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-800}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/tmp/freqtrade-dashboard-audit.jsonl}
      GIT_SHA: ${GIT_SHA:-unknown}
      STRATEGY_SHA: ${STRATEGY_SHA:-unknown}
      STRATEGY_VERSION: ${STRATEGY_VERSION:-SimpleSpot-v1}
      FREQTRADE_VERSION: ${FREQTRADE_VERSION:-unknown}
      DOCKER_IMAGE_DIGEST: ${DOCKER_IMAGE_DIGEST:-unknown}
      PROTOCOL_VERSION: ${PROTOCOL_VERSION:-1}
      EXPERIMENT_ID: ${EXPERIMENT_ID:-simplespot-v1-baseline}
    security_opt:
      - no-new-privileges:true
    networks:
      - ft-network

networks:
  ft-network:
    external: true
    name: binance-bot_internal
