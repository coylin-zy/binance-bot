name: Binance Bot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate templates and strategy syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("user_data/config.binance.example.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          if config.get("dry_run") is not True:
              raise SystemExit("The tracked configuration template must keep dry_run enabled")

          if config.get("exchange", {}).get("name") != "binance":
              raise SystemExit("The product runtime must target Binance global")

          if config.get("trading_mode") != "spot":
              raise SystemExit("The tracked configuration template must remain spot-only")

          if config.get("margin_mode") != "":
              raise SystemExit("The spot configuration must not enable a margin mode")

          if config.get("force_entry_enable") is not False:
              raise SystemExit("Manual force-entry must remain disabled")

          expected_ccxt_config = {
              "urls": {
                  "api": {
                      "public": "https://data-api.binance.vision/api/v3",
                  },
              },
              "options": {
                  "fetchMarkets": {
                      "types": ["spot"],
                  },
              },
          }
          expected_ccxt_async_config = {
              "urls": {
                  "api": {
                      "public": "https://data-api.binance.vision/api/v3",
                      "ws": {
                          "spot": "wss://data-stream.binance.vision/ws",
                      },
                  },
              },
              "options": {
                  "fetchMarkets": {
                      "types": ["spot"],
                  },
              },
          }
          exchange = config.get("exchange", {})
          if exchange.get("ccxt_config") != expected_ccxt_config:
              raise SystemExit(
                  "ccxt_config must use Binance global's public market-data "
                  "endpoint and spot-only discovery"
              )
          if exchange.get("ccxt_async_config") != expected_ccxt_async_config:
              raise SystemExit(
                  "ccxt_async_config must use Binance global's public market-data "
                  "REST/WebSocket endpoints and spot-only discovery"
              )

          api = config.get("api_server", {})
          placeholders = ("jwt_secret_key", "ws_token", "username", "password")
          invalid = [
              key for key in placeholders
              if not str(api.get(key, "")).startswith("CHANGE_ME")
          ]
          if invalid:
              raise SystemExit(f"Template contains non-placeholder API values: {invalid}")

          expected_pairs = ["BTC/USDT", "ETH/USDT", "XRP/USDT"]
          actual_pairs = config.get("exchange", {}).get("pair_whitelist")
          if actual_pairs != expected_pairs:
              raise SystemExit(
                  f"Trading universe must remain fixed to {expected_pairs}, got {actual_pairs}"
              )

          expected_pairlists = [{"method": "StaticPairList"}]
          actual_pairlists = config.get("pairlists")
          if actual_pairlists != expected_pairlists:
              raise SystemExit(
                  "The validation phase requires StaticPairList as the only pairlist "
                  f"handler, got {actual_pairlists}"
              )

          strategy_path = Path("user_data/strategies/SimpleSpot.py")
          compile(strategy_path.read_text(encoding="utf-8"), str(strategy_path), "exec")
          PY

      - name: Reject tracked runtime secrets and state
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(\.env\.local|cookies\.txt|bot\.coylin\.com\.nginx|config\.us\.json|config\.binance\.json|config\.json|.*\.sqlite(-shm|-wal)?|.*\.log)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Tracked runtime files are forbidden:"
            echo "$forbidden"
            exit 1
          fi

      - name: Validate Compose files
        env:
          FREQTRADE_WS_TOKEN: ci-placeholder-token
        shell: bash
        run: |
          root_compose="$(docker compose config)"
          grep -F -- "/freqtrade/user_data/config.binance.json" <<<"$root_compose" >/dev/null
          grep -F -- "SimpleSpot" <<<"$root_compose" >/dev/null

          docker compose \
            -f dashboard/docker-compose.yml \
            -f dashboard/docker-compose.override.yml \
            config >/dev/null

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck, unit test, build, and browser E2E
        run: npm run check

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-playwright-failure
          path: dashboard/test-results
          if-no-files-found: ignore

      - name: Audit production dependency risk
        run: npm audit --omit=dev --audit-level=high
