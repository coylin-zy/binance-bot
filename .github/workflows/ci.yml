name: Binance Bot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate templates and strategy syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("user_data/config.us.example.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          if config.get("dry_run") is not True:
              raise SystemExit("The tracked configuration template must keep dry_run enabled")

          api = config.get("api_server", {})
          placeholders = ("jwt_secret_key", "ws_token", "username", "password")
          invalid = [
              key for key in placeholders
              if not str(api.get(key, "")).startswith("CHANGE_ME")
          ]
          if invalid:
              raise SystemExit(f"Template contains non-placeholder API values: {invalid}")

          strategy_path = Path("user_data/strategies/SimpleSpot.py")
          compile(strategy_path.read_text(encoding="utf-8"), str(strategy_path), "exec")
          PY

      - name: Reject tracked runtime secrets and state
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(\.env\.local|config\.us\.json|.*\.sqlite(-shm|-wal)?|.*\.log)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Tracked runtime files are forbidden:"
            echo "$forbidden"
            exit 1
          fi

      - name: Validate Compose files
        env:
          FREQTRADE_WS_TOKEN: ci-placeholder-token
        run: |
          docker compose config >/dev/null
          docker compose \
            -f dashboard/docker-compose.yml \
            -f dashboard/docker-compose.override.yml \
            config >/dev/null

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit production dependency risk
        run: npm audit --omit=dev --audit-level=high
