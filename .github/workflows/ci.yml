name: Binance Bot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate templates and strategy syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("user_data/config.binance.example.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          if config.get("dry_run") is not True:
              raise SystemExit("The tracked configuration template must keep dry_run enabled")

          if config.get("exchange", {}).get("name") != "binance":
              raise SystemExit("The product runtime must target Binance global")

          api = config.get("api_server", {})
          placeholders = ("jwt_secret_key", "ws_token", "username", "password")
          invalid = [
              key for key in placeholders
              if not str(api.get(key, "")).startswith("CHANGE_ME")
          ]
          if invalid:
              raise SystemExit(f"Template contains non-placeholder API values: {invalid}")

          expected_pairs = ["BTC/USDT", "ETH/USDT", "XRP/USDT"]
          actual_pairs = config.get("exchange", {}).get("pair_whitelist")
          if actual_pairs != expected_pairs:
              raise SystemExit(
                  f"Trading universe must remain fixed to {expected_pairs}, got {actual_pairs}"
              )

          expected_pairlists = [{"method": "StaticPairList"}]
          actual_pairlists = config.get("pairlists")
          if actual_pairlists != expected_pairlists:
              raise SystemExit(
                  "The validation phase requires StaticPairList as the only pairlist "
                  f"handler, got {actual_pairlists}"
              )

          strategy_path = Path("user_data/strategies/SimpleSpot.py")
          compile(strategy_path.read_text(encoding="utf-8"), str(strategy_path), "exec")
          PY

      - name: Reject tracked runtime secrets and state
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(\.env\.local|config\.us\.json|config\.binance\.json|config\.json|.*\.sqlite(-shm|-wal)?|.*\.log)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Tracked runtime files are forbidden:"
            echo "$forbidden"
            exit 1
          fi

      - name: Validate Compose files
        env:
          FREQTRADE_WS_TOKEN: ci-placeholder-token
        shell: bash
        run: |
          root_compose="$(docker compose config)"
          grep -F -- "/freqtrade/user_data/config.binance.json" <<<"$root_compose" >/dev/null
          grep -F -- "SimpleSpot" <<<"$root_compose" >/dev/null

          docker compose \
            -f dashboard/docker-compose.yml \
            -f dashboard/docker-compose.override.yml \
            config >/dev/null

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit production dependency risk
        run: npm audit --omit=dev --audit-level=high

  market-data-snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    name: Market data snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Freqtrade
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install runtime dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install -e .

      - name: Download fixed market windows
        shell: bash
        run: |
          set -euo pipefail
          pairs=(BTC/USDT ETH/USDT XRP/USDT)
          common=(
            --config strategy_validation/freqtrade.validation.json
            --exchange binance
            --trading-mode spot
            --timeframes 5m
            --data-format-ohlcv jsongz
            --pairs "${pairs[@]}"
          )

          freqtrade download-data "${common[@]}" \
            --datadir strategy_validation/data/development_2024_q1 \
            --timerange 20231229-20240401
          freqtrade download-data "${common[@]}" \
            --datadir strategy_validation/data/validation_2024_q3 \
            --timerange 20240729-20241101
          freqtrade download-data "${common[@]}" \
            --datadir strategy_validation/data/holdout_2025_h1 \
            --timerange 20241229-20250701

          tar -czf strategy-data.tar.gz strategy_validation/data

      - name: Upload immutable data candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strategy-data-${{ github.sha }}
          path: strategy-data.tar.gz
          if-no-files-found: error
          retention-days: 7
