name: Strategy validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strategy-validation:
    name: Strategy validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          activate-environment: true
          python-version: "3.13"
          enable-cache: false

      - name: Install Freqtrade runtime
        run: |
          uv pip install -r requirements.txt
          uv pip install -e .

      - name: Validate protocol and dataset lock
        run: python3 strategy_validation/pipeline.py validate --require-data

      - name: Run pipeline unit tests
        run: python3 -m unittest discover -s strategy_validation/tests -v

      - name: Run fixed-data strategy validation
        run: python3 strategy_validation/pipeline.py run --freqtrade freqtrade

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strategy-validation-${{ github.sha }}
          path: strategy_validation/output/
          if-no-files-found: warn
          retention-days: 30
