version: 2

updates:
  - package-ecosystem: npm
    directory: /dashboard
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      dashboard-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /
      - /dashboard
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

# The preserved Freqtrade core follows upstream history. Sync it from upstream
# deliberately instead of allowing Dependabot to rewrite its Python dependency set.
